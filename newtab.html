<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- background layers -->
  <div id="bg-layer"></div>
  <img id="bg-image" alt="">
  <video id="bg-video" muted loop playsinline></video>
  <div id="bg-overlay"></div>

  <!-- widgets live here -->
  <div id="widgets"></div>

  <!-- bottom-right dock -->
  <div id="dock">
    <button id="btn-add" title="Add a widget">＋ Widget</button>
    <button id="btn-edit" title="Editor mode (E)">✏️ Edit layout</button>
    <button id="btn-settings" title="Background, soundtrack & more">⚙️</button>
  </div>

  <!-- hidden file pickers -->
  <input type="file" id="file-audio" accept="audio/*" multiple hidden>
  <input type="file" id="file-bg" accept="image/*,video/*" hidden>
  <input type="file" id="file-backup" accept="application/json,.json" hidden>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
